services:
  sshd:
    build:
      context: .
      dockerfile: docker/sshd/Dockerfile
    ports:
      - "2222-2224:22"
    cgroup: host
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s
    networks:
      - rusible
    deploy:
      replicas: 3

networks:
  rusible:
    driver: bridge

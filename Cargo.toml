[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
authors = ["jmjoy <jmjoy@qq.com>"]
edition = "2024"
license = "MulanPSL-2.0"
repository = "https://github.com/jmjoy/rusible"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.40", features = ["derive"] }
minijinja = "2.12.0"
reqwest = { version = "0.12.15", default-features = false }
rusible = { path = "crates/rusible", version = "0.1.0" }
rusible-exec = { path = "crates/rusible-exec", version = "0.1.0" }
rusible-template = { path = "crates/rusible-template", version = "0.1.0" }
russh = "0.57.1"
russh-sftp = "2.1.1"
rusible-meta = { path = "crates/rusible-meta", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
shlex = "1.3.0"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = "1.45.1"
toml = "0.8.23"
tracing = { version = "0.1.41", features = ["log"] }
tracing-forest = { version = "0.3.1", features = ["ansi", "chrono", "env-filter"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[profile.dev]
opt-level = 1
strip = "debuginfo"
